<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MailDesk</title>
<style>
:root{
  --bg:#f6f8fc; --panel:#fff; --text:#1f1f1f; --muted:#5f6368; --line:#e3e6ea; --hover:#eaf1fb;
  --read:#f2f6fc; --accent:#0b57d0; --accent-bg:#c2e7ff; --sel:#d3e3fd; --danger:#b3261e; --star:#f4b400;
  --shadow:0 1px 3px rgba(60,64,67,.3),0 4px 8px 3px rgba(60,64,67,.15);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#141518; --panel:#1e1f23; --text:#e8eaed; --muted:#9aa0a6; --line:#33353a; --hover:#2a2d33;
  --read:#191a1d; --accent:#8ab4f8; --accent-bg:#2b4a7a; --sel:#37507a; --danger:#f28b82;
}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:14px/1.45 "Google Sans",Roboto,"Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--text)}
button{font:inherit;color:inherit;cursor:pointer}
svg.i{width:20px;height:20px;fill:currentColor;flex:none}
.hidden{display:none!important}
.iconbtn{background:none;border:0;border-radius:50%;width:38px;height:38px;display:inline-flex;align-items:center;justify-content:center;color:var(--muted)}
.iconbtn:hover{background:var(--hover);color:var(--text)}
.iconbtn[disabled]{opacity:.35;pointer-events:none}

/* ---------- login ---------- */
#login{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:36px 40px;width:100%;max-width:520px}
.logo{font-size:26px;font-weight:600;letter-spacing:-.5px;display:flex;align-items:center;gap:10px}
.logo b{color:var(--accent)}
.card h2{font-size:15px;font-weight:400;color:var(--muted);margin:6px 0 20px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.chip{border:1px solid var(--line);background:none;border-radius:16px;padding:5px 14px;font-size:13px}
.chip.on{background:var(--accent-bg);border-color:transparent}
label{display:block;font-size:12px;color:var(--muted);margin:12px 0 4px}
input[type=text],input[type=email],input[type=password],input[type=number],select{
  width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--text);font:inherit}
input:focus,select:focus{outline:2px solid var(--accent);outline-offset:-1px}
.row{display:flex;gap:10px}.row>*{flex:1}
.row .w{flex:0 0 100px}
details{margin-top:14px;border-top:1px solid var(--line);padding-top:10px}
summary{cursor:pointer;color:var(--accent);font-size:13px}
.primary{background:var(--accent);color:#fff;border:0;border-radius:20px;padding:10px 26px;font-weight:500}
html[data-d] .primary{color:#000}
.primary:hover{filter:brightness(1.1)}
.primary[disabled]{opacity:.6}
.note{font-size:12px;color:var(--muted);margin-top:14px}
.err{color:var(--danger);font-size:13px;margin-top:12px;white-space:pre-wrap}

/* ---------- app shell ---------- */
#app{height:100%;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:8px;padding:8px 12px;height:64px;flex:none}
header .logo{font-size:20px;width:228px;flex:none}
.search{flex:1;max-width:720px;display:flex;align-items:center;background:var(--read);border-radius:24px;padding:0 6px;height:46px}
.search:focus-within{background:var(--panel);box-shadow:var(--shadow)}
.search input{flex:1;border:0;background:none;outline:0;font:inherit;color:var(--text);padding:0 6px}
.avatar{width:34px;height:34px;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:500;flex:none;font-size:14px}
.spacer{flex:1}
#acct{position:relative}
#acctmenu{position:absolute;right:0;top:44px;background:var(--panel);border-radius:16px;box-shadow:var(--shadow);padding:16px 20px;width:280px;z-index:30;text-align:center}
#acctmenu .avatar{width:56px;height:56px;font-size:22px;margin:0 auto 8px}
#body{flex:1;display:flex;min-height:0}
aside{width:256px;flex:none;padding:6px 12px 12px 8px;overflow-y:auto}
#compose-btn{display:flex;align-items:center;gap:12px;background:var(--accent-bg);border:0;border-radius:16px;padding:0 22px 0 16px;height:56px;font-weight:500;margin:6px 0 14px;box-shadow:0 1px 2px rgba(60,64,67,.2)}
#compose-btn:hover{box-shadow:var(--shadow)}
.folder{display:flex;align-items:center;gap:14px;height:32px;padding:0 12px 0 22px;border-radius:0 16px 16px 0;cursor:pointer;margin-right:-12px;color:var(--text);white-space:nowrap}
.folder:hover{background:var(--hover)}
.folder.on{background:var(--sel);font-weight:600}
.folder .n{margin-left:auto;font-size:12px;font-weight:600}
.folder span.l{overflow:hidden;text-overflow:ellipsis}
main{flex:1;min-width:0;background:var(--panel);border-radius:16px;margin:0 16px 16px 0;display:flex;flex-direction:column;overflow:hidden}
.toolbar{display:flex;align-items:center;gap:2px;padding:6px 12px;border-bottom:1px solid var(--line);min-height:50px;flex:none}
.toolbar .sep{width:1px;height:20px;background:var(--line);margin:0 6px}
.toolbar .pg{margin-left:auto;display:flex;align-items:center;gap:4px;color:var(--muted);font-size:12px}
.filters{display:flex;gap:6px;padding:6px 16px;border-bottom:1px solid var(--line);flex:none}
.filters .chip{padding:3px 12px;font-size:12px}
#list{flex:1;overflow-y:auto}
.msg{display:flex;align-items:center;gap:10px;padding:0 16px;height:42px;border-bottom:1px solid var(--line);cursor:pointer;background:var(--read)}
.msg.unread{background:var(--panel);font-weight:600}
.msg:hover{box-shadow:inset 1px 0 0 var(--line),0 1px 3px rgba(60,64,67,.25);z-index:1;position:relative}
.msg.sel{background:var(--sel)}
.msg .from{width:200px;flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.msg .subj{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.msg .subj em{font-style:normal;color:var(--muted);font-weight:400}
.msg .date{flex:none;font-size:12px;width:62px;text-align:right}
.msg:not(.unread) .date{color:var(--muted)}
.star{background:none;border:0;padding:0;display:flex;color:var(--muted)}
.star.on{color:var(--star)}
.empty{padding:60px 20px;text-align:center;color:var(--muted)}
.loading{padding:30px;text-align:center;color:var(--muted)}
input[type=checkbox]{width:16px;height:16px;accent-color:var(--accent);cursor:pointer;flex:none}

/* ---------- reader ---------- */
#reader{flex:1;overflow-y:auto;padding:0 24px 24px}
#reader h1{font-size:22px;font-weight:400;margin:20px 0 16px}
.mhead{display:flex;gap:12px;align-items:flex-start;margin-bottom:14px}
.mhead .meta{flex:1;min-width:0}
.mhead .nm{font-weight:600}.mhead .ad{color:var(--muted);font-size:12px}
.mhead .to{color:var(--muted);font-size:12px}
.mhead .dt{color:var(--muted);font-size:12px;white-space:nowrap}
.mbody{margin-left:46px}
.mbody iframe{width:100%;border:0;display:block;min-height:60px;background:#fff;border-radius:4px}
.mbody pre{white-space:pre-wrap;word-wrap:break-word;font:inherit;margin:0}
.banner{background:var(--read);border-radius:8px;padding:8px 12px;margin:0 0 10px;font-size:12px;color:var(--muted)}
.banner button{background:none;border:0;color:var(--accent);padding:0 0 0 6px}
.atts{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 0 46px}
.att{border:1px solid var(--line);border-radius:8px;padding:8px 12px;display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--text);font-size:12px}
.att:hover{background:var(--hover)}
.actions{display:flex;gap:10px;margin:24px 0 0 46px}
.pill{border:1px solid var(--line);background:none;border-radius:18px;padding:8px 18px;display:flex;align-items:center;gap:8px}
.pill:hover{background:var(--hover)}

/* ---------- compose ---------- */
#compose{position:fixed;right:24px;bottom:0;width:560px;max-width:calc(100vw - 16px);background:var(--panel);border-radius:12px 12px 0 0;box-shadow:var(--shadow);display:flex;flex-direction:column;z-index:40;max-height:80vh}
#compose .ch{background:#404040;color:#fff;border-radius:12px 12px 0 0;padding:8px 8px 8px 16px;display:flex;align-items:center;font-size:14px;cursor:pointer}
#compose .ch .iconbtn{color:#fff;width:30px;height:30px}#compose .ch .iconbtn:hover{background:#ffffff30}
#compose.min .cbody{display:none}
.cbody{display:flex;flex-direction:column;min-height:0;flex:1}
.cf{display:flex;align-items:center;border-bottom:1px solid var(--line);padding:2px 14px}
.cf span{color:var(--muted);width:44px;flex:none}
.cf input{flex:1;border:0;background:none;outline:0;padding:8px 0;font:inherit;color:var(--text)}
.cf a{color:var(--muted);font-size:12px;cursor:pointer;margin-left:8px}
#ceditor{flex:1;min-height:240px;overflow-y:auto;padding:12px 16px;outline:0}
#ceditor blockquote{margin:0 0 0 .8ex;border-left:2px solid var(--line);padding-left:1ex;color:var(--muted)}
.cfoot{display:flex;align-items:center;gap:6px;padding:8px 12px;flex-wrap:wrap}
.cfoot .primary{padding:8px 22px}
.fmt{background:none;border:0;border-radius:4px;padding:4px 8px;color:var(--muted)}
.fmt:hover{background:var(--hover)}
#cfiles{display:flex;flex-wrap:wrap;gap:6px;padding:0 14px}
#cfiles .att{padding:3px 8px}
#cfiles .att button{background:none;border:0;padding:0 0 0 4px;color:var(--muted)}

/* misc */
.menu{position:absolute;background:var(--panel);box-shadow:var(--shadow);border-radius:8px;padding:6px 0;z-index:50;min-width:200px;max-height:300px;overflow-y:auto}
.menu div{padding:7px 16px;cursor:pointer;white-space:nowrap}
.menu div:hover{background:var(--hover)}
#toast{position:fixed;left:24px;bottom:24px;background:#323232;color:#fff;padding:12px 20px;border-radius:6px;z-index:90;box-shadow:var(--shadow);max-width:60vw}
#toast.bad{background:#8c1d18}
@media(max-width:860px){
  header .logo{width:auto}header .logo span{display:none}
  aside{position:fixed;left:0;top:64px;bottom:0;background:var(--bg);z-index:35;transform:translateX(-100%);transition:.2s;box-shadow:var(--shadow)}
  aside.open{transform:none}
  main{margin:0 6px 6px}
  .msg .from{width:110px}
  #compose{right:4px}
  .mbody,.atts,.actions{margin-left:0}
}
</style>
</head>
<body>

<!-- ============ LOGIN ============ -->
<div id="login" class="hidden">
  <form class="card" id="loginform" autocomplete="on">
    <div class="logo">✉ <span>Mail<b>Desk</b></span></div>
    <h2>Sign in with any email account (IMAP / SMTP)</h2>
    <div class="chips" id="providers"></div>

    <label>Email address</label>
    <input type="email" id="f_email" required autocomplete="username" placeholder="you@example.com">
    <label>Your name <span style="opacity:.7">(shown on sent mail, optional)</span></label>
    <input type="text" id="f_name" autocomplete="name">
    <label>Password / app password</label>
    <input type="password" id="f_pass" required autocomplete="current-password">

    <details id="adv">
      <summary>Server settings</summary>
      <div class="row">
        <div><label>IMAP server</label><input type="text" id="f_ih"></div>
        <div class="w"><label>Port</label><input type="number" id="f_ip"></div>
        <div class="w"><label>Security</label>
          <select id="f_is"><option value="ssl">SSL/TLS</option><option value="starttls">STARTTLS</option><option value="none">None</option></select></div>
      </div>
      <div class="row">
        <div><label>SMTP server</label><input type="text" id="f_sh"></div>
        <div class="w"><label>Port</label><input type="number" id="f_sp"></div>
        <div class="w"><label>Security</label>
          <select id="f_ss"><option value="starttls">STARTTLS</option><option value="ssl">SSL/TLS</option><option value="none">None</option></select></div>
      </div>
      <label>Username <span style="opacity:.7">(only if different from the email address)</span></label>
      <input type="text" id="f_user">
    </details>

    <div class="err hidden" id="loginerr"></div>
    <div style="margin-top:22px;display:flex;align-items:center;gap:14px">
      <button class="primary" id="loginbtn" type="submit">Sign in</button>
      <span class="note" style="margin:0" id="hint"></span>
    </div>
    <div class="note">Your password is held only in the server's memory for this session and is never saved to disk.</div>
  </form>
</div>

<!-- ============ APP ============ -->
<div id="app" class="hidden">
  <header>
    <button class="iconbtn" id="menubtn" title="Menu"></button>
    <div class="logo">✉ <span>Mail<b>Desk</b></span></div>
    <form class="search" id="searchform">
      <span class="iconbtn" style="width:34px;height:34px" id="searchicon"></span>
      <input id="q" placeholder="Search mail" autocomplete="off">
      <button type="button" class="iconbtn hidden" id="clearq" style="width:34px;height:34px"></button>
    </form>
    <div class="spacer"></div>
    <div id="acct">
      <div class="avatar" id="avatar" style="cursor:pointer"></div>
      <div id="acctmenu" class="hidden">
        <div class="avatar" id="avatar2"></div>
        <div id="acctname" style="font-weight:600"></div>
        <div id="acctmail" style="color:var(--muted);margin-bottom:14px"></div>
        <button class="pill" style="margin:0 auto" id="logoutbtn">Sign out</button>
      </div>
    </div>
  </header>
  <div id="body">
    <aside id="side">
      <button id="compose-btn"></button>
      <div id="folders"></div>
    </aside>
    <main>
      <div class="toolbar" id="toolbar"></div>
      <div class="filters" id="filters">
        <button class="chip on" data-f="">All</button>
        <button class="chip" data-f="unread">Unread</button>
        <button class="chip" data-f="starred">Starred</button>
      </div>
      <div id="list"></div>
      <div id="reader" class="hidden"></div>
    </main>
  </div>
</div>

<div id="compose" class="hidden">
  <div class="ch" id="chead"><span id="ctitle" style="flex:1">New Message</span>
    <button class="iconbtn" id="cmin" title="Minimize">–</button>
    <button class="iconbtn" id="cclose" title="Close"></button></div>
  <div class="cbody">
    <div class="cf"><span>To</span><input id="c_to" autocomplete="off"><a id="showcc">Cc</a><a id="showbcc">Bcc</a></div>
    <div class="cf hidden" id="rowcc"><span>Cc</span><input id="c_cc" autocomplete="off"></div>
    <div class="cf hidden" id="rowbcc"><span>Bcc</span><input id="c_bcc" autocomplete="off"></div>
    <div class="cf"><input id="c_subj" placeholder="Subject" autocomplete="off"></div>
    <div id="ceditor" contenteditable="true"></div>
    <div id="cfiles"></div>
    <div class="cfoot">
      <button class="primary" id="csend">Send</button>
      <button class="fmt" data-cmd="bold"><b>B</b></button>
      <button class="fmt" data-cmd="italic"><i>I</i></button>
      <button class="fmt" data-cmd="underline"><u>U</u></button>
      <button class="fmt" data-cmd="insertUnorderedList">• List</button>
      <button class="fmt" id="clink">Link</button>
      <button class="iconbtn" id="cattach" title="Attach files"></button>
      <input type="file" id="cfile" multiple class="hidden">
      <span class="spacer"></span>
      <button class="fmt" id="cdraft">Save draft</button>
      <button class="iconbtn" id="cdiscard" title="Discard draft"></button>
    </div>
  </div>
</div>
<div id="toast" class="hidden"></div>

const ic=(n,s)=>`<svg class="i" viewBox="0 0 24 24"${s?` style="${s}"`:""}><path d="${P[n]}"/></svg>`;
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ---------------- api ---------------- */
async function api(path,opts={}){
  const o={credentials:"same-origin",...opts};
  if(o.json){o.method="POST";o.headers={"Content-Type":"application/json"};o.body=JSON.stringify(o.json);}
  const r=await fetch(path,o);

}

}
function sanitize(html){
  const doc=new DOMParser().parseFromString(html,"text/html");
  doc.querySelectorAll("script,style,iframe,object,embed,link,meta,form,base,svg,math").forEach(n=>n.remove());
  doc.body.querySelectorAll("*").forEach(n=>{
    for(const a of [...n.attributes]){
      const v=a.value.trim().toLowerCase();
      if(a.name.startsWith("on")||a.name==="style"||((a.name==="href"||a.name==="src")&&!/^(https?:|mailto:|data:image\/)/.test(v)))n.removeAttribute(a.name);
    }
  });
  return doc.body.innerHTML;
}
function openDraft(d){
  const html=d.html?sanitize(d.html):esc(d.text||"").replace(/\n/g,"<br>");
  openCompose({to:d.to.map(a=>a.addr).join(", "),cc:d.cc.map(a=>a.addr).join(", "),subject:d.subject==="(no subject)"?"":d.subject,
    html,draftUid:d.uid,draftFolder:d.folder,title:"Draft",inReplyTo:"",refs:""});
}
function renderFiles(){
  $("cfiles").innerHTML=C.files.map((f,i)=>`<span class="att">${esc(f.name)} <span style="color:var(--muted)">${fmtSize(f.size)}</span><button data-i="${i}">✕</button></span>`).join("");
}
$("cfiles").onclick=e=>{const b=e.target.closest("button");if(b){C.files.splice(+b.dataset.i,1);renderFiles();}};
$("cattach").onclick=()=>$("cfile").click();
$("cfile").onchange=e=>{C.files.push(...e.target.files);e.target.value="";renderFiles();};
$("showcc").onclick=()=>$("rowcc").classList.remove("hidden");
$("showbcc").onclick=()=>$("rowbcc").classList.remove("hidden");
document.querySelectorAll(".fmt[data-cmd]").forEach(b=>{b.onmousedown=e=>{e.preventDefault();document.execCommand(b.dataset.cmd);};});
$("clink").onmousedown=e=>{e.preventDefault();const u=prompt("Link URL (https://…)");if(u&&/^(https?:|mailto:)/i.test(u))document.execCommand("createLink",false,u);};
$("cmin").onclick=e=>{e.stopPropagation();$("compose").classList.toggle("min");};
$("chead").onclick=()=>{if($("compose").classList.contains("min"))$("compose").classList.remove("min");};
function closeCompose(force){
  if(!force&&($("ceditor").innerText.trim()||$("c_to").value.trim()||C.files.length)&&!confirm("Discard this message?"))return;
  $("compose").classList.add("hidden");$("ceditor").innerHTML="";
}
$("cclose").onclick=e=>{e.stopPropagation();closeCompose();};
$("cdiscard").onclick=()=>closeCompose();
$("compose-btn").onclick=()=>openCompose({});
function composeForm(){
  const fd=new FormData();const ed=$("ceditor");
  const html=`<div style="font-family:Arial,sans-serif;font-size:14px">${ed.innerHTML}</div>`;
  fd.append("payload",JSON.stringify({to:$("c_to").value,cc:$("c_cc").value,bcc:$("c_bcc").value,subject:$("c_subj").value,
    html,text:ed.innerText,in_reply_to:C.inReplyTo,references:C.refs,draft_uid:C.draftUid,draft_folder:C.draftFolder}));
  C.files.forEach(f=>fd.append("attachments",f,f.name));return fd;
}
$("csend").onclick=guard(async()=>{
  if(!$("c_to").value.trim()&&!$("c_cc").value.trim()&&!$("c_bcc").value.trim()){toast("Add at least one recipient",true);return;}
  if(!$("c_subj").value.trim()&&!confirm("Send this message without a subject?"))return;
  $("csend").disabled=true;$("csend").textContent="Sending…";
  try{await api("/api/send",{method:"POST",body:composeForm()});closeCompose(true);toast("Message sent");
    if(["sent","drafts"].includes(role(S.folder)))loadList(true);loadFolders();}
  finally{$("csend").disabled=false;$("csend").textContent="Send";}
});
$("cdraft").onclick=guard(async()=>{
  await api("/api/draft",{method:"POST",body:composeForm()});closeCompose(true);toast("Draft saved");loadFolders();
  if(role(S.folder)==="drafts")loadList(true);
});

/* ---------------- shell ---------------- */
$("menubtn").innerHTML=ic("menu");$("searchicon").innerHTML=ic("search");$("clearq").innerHTML=ic("close");
$("compose-btn").innerHTML=ic("edit")+"Compose";$("cclose").innerHTML=ic("close");
$("cattach").innerHTML=ic("attach");$("cdiscard").innerHTML=ic("trash");
$("menubtn").onclick=()=>$("side").classList.toggle("open");
$("avatar").onclick=e=>{e.stopPropagation();$("acctmenu").classList.toggle("hidden");};
$("logoutbtn").onclick=async()=>{await api("/api/logout",{json:{}}).catch(()=>{});S.me=null;showLogin();};
setInterval(()=>{
  if(!S.me||S.open||S.sel.size||S.page!==1||S.q||!$("compose").classList.contains("hidden")&&false)return;
  loadFolders();loadList(true);
},60000);

(async function boot(){
  initLogin();
  try{const me=await api("/api/me");startApp(me);}catch(e){showLogin();}
})();
</script>
